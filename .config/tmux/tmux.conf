set -g prefix C-a
unbind C-b
bind C-a send-prefix

if-shell 'test -x /Users/yg_jung/.nix-profile/bin/fish' 'set -g default-shell /Users/yg_jung/.nix-profile/bin/fish'
if-shell 'test ! -x /Users/yg_jung/.nix-profile/bin/fish && test -x /opt/homebrew/bin/fish' 'set -g default-shell /opt/homebrew/bin/fish'
if-shell 'test ! -x /Users/yg_jung/.nix-profile/bin/fish && test ! -x /opt/homebrew/bin/fish && test -x /usr/local/bin/fish' 'set -g default-shell /usr/local/bin/fish'
set -gu default-command

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

set -g mouse on
# Toggle tmux mouse capture when GUI-terminal link clicks/selection need to win.
bind m if -F '#{mouse}' 'set -g mouse off; display-message "tmux mouse off"' 'set -g mouse on; display-message "tmux mouse on"'
# Permit passthrough escape sequences for terminal-native features such as
# OSC 8 hyperlinks when applications emit them. Guard newer options so older
# on-prem tmux versions do not exit while reading this shared config.
if-shell 'tmux -V | awk "{ split(\$2,v,\".\"); exit ! (v[1] > 3 || (v[1] == 3 && v[2] + 0 >= 3)) }"' 'set -g allow-passthrough on'
set -sg escape-time 10
set -g focus-events on
if-shell 'tmux -V | awk "{ split(\$2,v,\".\"); exit ! (v[1] > 3 || (v[1] == 3 && v[2] + 0 >= 2)) }"' 'set -g extended-keys on'
if-shell 'tmux -V | awk "{ split(\$2,v,\".\"); exit ! (v[1] > 3 || (v[1] == 3 && v[2] + 0 >= 5)) }"' 'set -g extended-keys-format csi-u'
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,●,○} #T "
set -g pane-border-style "fg=#5c6370"
set -g pane-active-border-style "fg=#98c379"
set -g pane-status-style "fg=#7f848e,bg=default"
set -g pane-status-current-style "fg=#111111,bg=#98c379,bold"
setw -gu window-style
setw -gu window-active-style

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",tmux-256color:RGB"
# Let tmux pass hyperlink and synchronized-output sequences through to the GUI terminal.
# Pi uses synchronized redraws during resize/full renders; without sync, long
# sessions visibly replay line-by-line on pane zoom/resize.
if-shell 'tmux -V | awk "{ split(\$2,v,\".\"); exit ! (v[1] > 3 || (v[1] == 3 && v[2] + 0 >= 2)) }"' 'set -gu terminal-features; set -g terminal-features[0] "xterm*:clipboard:ccolour:cstyle:focus:title:hyperlinks"; set -g terminal-features[1] "screen*:title"; set -g terminal-features[2] "rxvt*:ignorefkeys"; set -g terminal-features[3] "*:hyperlinks"; set -g terminal-features[4] "xterm-256color:sync"; set -g terminal-features[5] "xterm-ghostty:sync"; set -g terminal-features[6] "wezterm:sync"'
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 30
set -g status-right-length 60

bind | split-window -h
bind - split-window -v
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

setw -g mode-keys vi
